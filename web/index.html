<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ochil Dasturxon AI · Uzbek Dish Classifier</title>
<meta name="description" content="Upload a photo of lagman, manti, plov or somsa — a ResNet18 model names the dish, right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%8C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --lapis:#14398a; --deep:#0a1d4d; --turq:#2fb3c0; --gold:#d9a441; --cream:#f3e7cf;
        --muted:#b8c6e0; --card:rgba(10,29,77,.94); --brown:#5a3a17; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--cream);
  font-family: 'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif;
  background:
    url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2284%22%20height%3D%2284%22%3E%3Cpolygon%20points%3D%2229%2C29%2055%2C29%2055%2C55%2029%2C55%22%20fill%3D%22%23fff8e6%22%20fill-opacity%3D%22.22%22%20stroke%3D%22%238a5a2b%22%20stroke-opacity%3D%22.22%22%20stroke-width%3D%221%22/%3E%3Cpolygon%20points%3D%2242%2C23.618000000000002%2060.382%2C42%2042%2C60.382%2023.618000000000002%2C42%22%20fill%3D%22%23fff8e6%22%20fill-opacity%3D%22.22%22%20stroke%3D%22%238a5a2b%22%20stroke-opacity%3D%22.22%22%20stroke-width%3D%221%22/%3E%3Cpolygon%20points%3D%22-6%2C-6%206%2C-6%206%2C6%20-6%2C6%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%220%2C-8.484%208.484%2C0%200%2C8.484%20-8.484%2C0%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%2278%2C-6%2090%2C-6%2090%2C6%2078%2C6%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%2284%2C-8.484%2092.484%2C0%2084%2C8.484%2075.516%2C0%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%22-6%2C78%206%2C78%206%2C90%20-6%2C90%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%220%2C75.516%208.484%2C84%200%2C92.484%20-8.484%2C84%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%2278%2C78%2090%2C78%2090%2C90%2078%2C90%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3Cpolygon%20points%3D%2284%2C75.516%2092.484%2C84%2084%2C92.484%2075.516%2C84%22%20fill%3D%22%238a5a2b%22%20fill-opacity%3D%22.14%22/%3E%3C/svg%3E"),
    repeating-linear-gradient(0deg, rgba(138,90,43,.07) 0 1px, transparent 1px 28px),
    radial-gradient(circle at 50% 0%, #f3dca8 0%, #e2bf7f 45%, #c99a55 100%);
  background-attachment: fixed;
}
main { max-width: 780px; margin: 0 auto; padding: 2.2rem 1rem 1rem; }
.band { height: 18px; background: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2236%22%20height%3D%2218%22%3E%3Crect%20width%3D%2236%22%20height%3D%2218%22%20fill%3D%22%2314398a%22/%3E%3Cpolygon%20points%3D%2218%2C1%2034%2C9%2018%2C17%202%2C9%22%20fill%3D%22%232fb3c0%22/%3E%3Cpolygon%20points%3D%2218%2C5%2026%2C9%2018%2C13%2010%2C9%22%20fill%3D%22%23f3e7cf%22/%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%229%22%20r%3D%221.6%22%20fill%3D%22%2314398a%22/%3E%3Ccircle%20cx%3D%220%22%20cy%3D%229%22%20r%3D%222%22%20fill%3D%22%23d9a441%22/%3E%3Ccircle%20cx%3D%2236%22%20cy%3D%229%22%20r%3D%222%22%20fill%3D%22%23d9a441%22/%3E%3C/svg%3E") repeat-x center; border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); }

/* header portal */
.pishtaq { width: 100%; height: auto; display: block; filter: drop-shadow(0 12px 24px rgba(90,58,23,.45)); }
.t-eyebrow { font: 600 15px 'Marcellus', serif; letter-spacing: 5px; fill: var(--gold); }
.t-title { font: 44px 'Marcellus', serif; fill: var(--cream); }
.t-gold { fill: var(--gold); }
.t-sub { font: 15px 'Source Sans 3', sans-serif; fill: var(--muted); }

.chips { display: flex; justify-content: center; gap: .55rem; flex-wrap: wrap; margin: 1.3rem 0 1.4rem; }
.chip { font-family: 'Marcellus', serif; border: 1px solid var(--gold); background: var(--lapis); color: var(--cream);
        padding: .32rem .95rem; border-radius: 6px; font-size: .95rem; box-shadow: 0 3px 8px rgba(90,58,23,.25); }

/* upload box */
.drop { background: var(--card); border: 2px solid var(--gold); border-radius: 10px; min-height: 200px;
        outline: 1px dashed var(--turq); outline-offset: -10px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: 1.6rem; cursor: pointer;
        transition: background .2s, transform .2s; box-shadow: 0 10px 26px rgba(90,58,23,.35); }
.drop:hover, .drop.over { background: rgba(20,57,138,.95); }
.drop.over { transform: scale(1.01); }
.drop .icon { color: var(--gold); font-size: 2.2rem; line-height: 1; margin-bottom: .4rem; }
.drop .title { font-family: 'Marcellus', serif; font-size: 1.3rem; margin-bottom: .25rem; }
.drop .hint { color: var(--muted); font-size: .85rem; margin-bottom: .9rem; }
.btn { background: var(--gold); color: var(--deep); border: none; border-radius: 6px; font: 700 1rem 'Source Sans 3', sans-serif;
       padding: .5rem 1.4rem; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: wait; }
.status { color: var(--muted); font-size: .82rem; margin-top: .8rem; min-height: 1.1em; }
.status.err { color: #f5a37a; }
input[type=file] { display: none; }

/* result card */
.result { background: var(--card); border: 2px solid var(--gold); border-radius: 10px; margin: 1.4rem 0; overflow: hidden;
          box-shadow: 0 10px 26px rgba(90,58,23,.35); animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.result .body { display: flex; gap: 1.5rem; align-items: center; padding: 1.3rem; }
.result img { width: 44%; aspect-ratio: 4/5; object-fit: cover; border: 3px solid var(--gold);
              border-radius: 50% 50% 8px 8px / 32% 32% 8px 8px; }
.result .info { flex: 1; min-width: 0; }
.fname { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish { font-family: 'Marcellus', serif; font-size: 2.3rem; margin: .15rem 0 .35rem; }
.badge { display: inline-block; padding: .25rem .75rem; border-radius: 6px; font-weight: 700; font-size: .85rem; margin-bottom: .9rem; }
.badge.ok { background: rgba(47,179,192,.18); color: #7fe3ea; border: 1px solid var(--turq); }
.badge.low { background: rgba(217,164,65,.16); color: var(--gold); border: 1px solid var(--gold); }
.note { color: var(--gold); font-size: .85rem; margin: -.4rem 0 .8rem; }
.bar { margin: .5rem 0; }
.bar .row { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); }
.bar .track { height: 9px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: .22rem; }
.bar .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--turq), var(--gold)); transition: width .8s ease-out; }
.bar.top .row { color: var(--cream); font-weight: 700; }

/* stats */
.stats { display: flex; gap: .8rem; margin: 2rem 0 1rem; }
.stat { flex: 1; text-align: center; padding: 1.4rem .4rem .9rem; background: var(--card); border: 2px solid var(--gold);
        border-radius: 50% 50% 8px 8px / 26% 26% 8px 8px; box-shadow: 0 6px 14px rgba(90,58,23,.3); }
.stat b { display: block; font-family: 'Marcellus', serif; font-size: 1.7rem; color: var(--gold); font-weight: 400; }
.stat span { color: var(--muted); font-size: .85rem; }
.foot { text-align: center; color: var(--brown); font-size: .85rem; margin: 1.1rem 0 1.4rem; line-height: 1.6; }
.foot a { color: var(--lapis); font-weight: 600; }

@media (max-width: 640px) {
  .result .body { flex-direction: column; }
  .result img { width: 80%; }
  .stats { gap: .4rem; }
  .stat b { font-size: 1.3rem; }
}
</style>
</head>
<body>
<main>
  <svg class="pishtaq" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Which Uzbek dish is this?">
  <defs><pattern id="tile" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#14398a"/><polygon points="13,13 31,13 31,31 13,31" fill="#2fb3c0" stroke="#f3e7cf" stroke-width="1"/><polygon points="22,9.274000000000001 34.726,22 22,34.726 9.274000000000001,22" fill="#2fb3c0" stroke="#f3e7cf" stroke-width="1"/><circle cx="22" cy="22" r="3.2" fill="#f3e7cf"/><polygon points="-4,-4 4,-4 4,4 -4,4" fill="#d9a441"/><polygon points="0,-5.656 5.656,0 0,5.656 -5.656,0" fill="#d9a441"/><polygon points="40,-4 48,-4 48,4 40,4" fill="#d9a441"/><polygon points="44,-5.656 49.656,0 44,5.656 38.344,0" fill="#d9a441"/><polygon points="-4,40 4,40 4,48 -4,48" fill="#d9a441"/><polygon points="0,38.344 5.656,44 0,49.656 -5.656,44" fill="#d9a441"/><polygon points="40,40 48,40 48,48 40,48" fill="#d9a441"/><polygon points="44,38.344 49.656,44 44,49.656 38.344,44" fill="#d9a441"/></pattern><linearGradient id="niche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2a6b"/><stop offset="1" stop-color="#0a1d4d"/></linearGradient></defs>
  <rect width="720" height="380" rx="8" fill="url(#tile)"/>
  <rect x="10" y="10" width="700" height="370" rx="4" fill="none" stroke="#d9a441" stroke-width="3"/>
  <rect x="22" y="22" width="676" height="358" fill="none" stroke="#f3e7cf" stroke-opacity=".55"/>
  <path d="M150 372 L150 190 Q150 82 360 34 Q570 82 570 190 L570 372 Z" fill="url(#niche)" stroke="#d9a441" stroke-width="4"/>
  <path d="M168 372 L168 194 Q168 100 360 56 Q552 100 552 194 L552 372" fill="none" stroke="#2fb3c0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="360" y="134" text-anchor="middle" class="t-eyebrow">OCHIL DASTURXON AI</text>
  <text x="360" y="196" text-anchor="middle" class="t-title">Which <tspan class="t-gold">Uzbek dish</tspan></text>
  <text x="360" y="246" text-anchor="middle" class="t-title">is this?</text>
  <text x="360" y="292" text-anchor="middle" class="t-sub">A ResNet18 fine-tuned on Central Asian dishes</text>
  <text x="360" y="316" text-anchor="middle" class="t-sub">runs right here in your browser</text>
  <polygon points="352,344 368,344 368,360 352,360" fill="#d9a441"/><polygon points="360,340.688 371.312,352 360,363.312 348.688,352" fill="#d9a441"/>
</svg>

  <div class="chips">
    <div class="chip">🍜 Lagman</div><div class="chip">🥟 Manti</div><div class="chip">🍚 Plov</div><div class="chip">🥐 Somsa</div>
  </div>

  <label class="drop" id="drop" for="file">
    <div class="icon">✦</div>
    <div class="title">Drop a photo of your dish</div>
    <div class="hint">or click to choose · JPG, PNG, WEBP · your photo never leaves your device</div>
    <span class="btn" id="btn">Choose photos</span>
    <div class="status" id="status">Loading model…</div>
  </label>
  <input type="file" id="file" accept="image/*" multiple>

  <div id="results"></div>

  <div class="stats">
    <div class="stat"><b>99.3%</b><span>test accuracy</span></div>
    <div class="stat"><b>0.993</b><span>macro F1</span></div>
    <div class="stat"><b>405</b><span>test images</span></div>
  </div>
  <div class="band"></div>
  <div class="foot">
    ResNet18 fine-tuned on the Central Asian Food Dataset (ISSAI)
    · runs entirely in your browser with ONNX Runtime Web<br>
    The model always picks one of the 4 dishes · Design inspired by the tilework of the Registan, Samarkand
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.min.js"></script>
<script>
const ORT_DIST = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/";
const MODEL_URL = "model.onnx";
const CLASSES = ["lagman", "manti", "plov", "somsa"];          // same order as training
const LABELS = { lagman: "Lagman", manti: "Manti", plov: "Plov", somsa: "Somsa" };
const EMOJI = { lagman: "🍜", manti: "🥟", plov: "🍚", somsa: "🥐" };
const MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];  // ImageNet
const SIZE = 224, LOW_CONFIDENCE = 0.60;

const statusEl = document.getElementById("status");
const fileEl = document.getElementById("file");
const dropEl = document.getElementById("drop");
const resultsEl = document.getElementById("results");
let session = null;

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("err", isError);
}

// Download the model with a progress counter, then create the ONNX Runtime session
async function loadModel() {
  ort.env.wasm.wasmPaths = ORT_DIST;
  const res = await fetch(MODEL_URL);
  if (!res.ok) throw new Error("model file not found (" + res.status + ")");
  const total = +res.headers.get("Content-Length") || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    setStatus(total ? `Loading model… ${Math.round(100 * got / total)}%` : `Loading model… ${(got / 1e6).toFixed(0)} MB`);
  }
  const bytes = new Uint8Array(got); let off = 0;
  for (const c of chunks) { bytes.set(c, off); off += c.length; }
  session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });
  setStatus("Model ready ✓");
}

// Same preprocessing as training: resize to 224×224 (stretch), /255, ImageNet mean/std, CHW
function toTensor(img) {
  const canvas = document.createElement("canvas");
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  const px = ctx.getImageData(0, 0, SIZE, SIZE).data;
  const n = SIZE * SIZE, data = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    for (let c = 0; c < 3; c++) data[c * n + i] = (px[i * 4 + c] / 255 - MEAN[c]) / STD[c];
  }
  return new ort.Tensor("float32", data, [1, 3, SIZE, SIZE]);
}

function softmax(logits) {
  const m = Math.max(...logits), e = logits.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => reject(new Error("cannot read image"));
    img.src = url;
  });
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }

function renderResult(name, url, probs) {
  const order = probs.map((p, i) => i).sort((a, b) => probs[b] - probs[a]);
  const best = CLASSES[order[0]], conf = probs[order[0]];
  const badge = conf >= LOW_CONFIDENCE
    ? `<div class="badge ok">${(conf * 100).toFixed(1)}% confident</div>`
    : `<div class="badge low">${(conf * 100).toFixed(1)}% · not sure</div>
       <div class="note">This may not be one of the 4 dishes, or the photo is unusual.</div>`;
  const bars = order.map(i => `
    <div class="bar${i === order[0] ? " top" : ""}">
      <div class="row"><span>${EMOJI[CLASSES[i]]} ${LABELS[CLASSES[i]]}</span><span>${(probs[i] * 100).toFixed(1)}%</span></div>
      <div class="track"><div class="fill" data-w="${(probs[i] * 100).toFixed(1)}"></div></div>
    </div>`).join("");
  const card = document.createElement("div");
  card.className = "result";
  card.innerHTML = `<div class="band"></div><div class="body">
      <img src="${url}" alt="uploaded dish">
      <div class="info"><div class="fname">${escapeHtml(name)}</div>
        <div class="dish">${EMOJI[best]} ${LABELS[best]}</div>${badge}${bars}</div></div>`;
  resultsEl.prepend(card);
  requestAnimationFrame(() => card.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"));
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function handleFiles(files) {
  if (!session) { setStatus("Model is still loading — try again in a moment.", true); return; }
  for (const file of files) {
    if (!file.type.startsWith("image/")) { setStatus(`${file.name} is not an image.`, true); continue; }
    try {
      setStatus(`Looking at ${file.name}…`);
      const { img, url } = await loadImage(file);
      const out = await session.run({ input: toTensor(img) });
      renderResult(file.name, url, softmax(Array.from(out.logits.data)));
      setStatus("Model ready ✓ · drop another photo");
    } catch (e) {
      setStatus(`Could not process ${file.name}: ${e.message}`, true);
    }
  }
}

fileEl.addEventListener("change", e => { handleFiles(e.target.files); fileEl.value = ""; });
["dragenter", "dragover"].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove("over"); }));
dropEl.addEventListener("drop", e => handleFiles(e.dataTransfer.files));

loadModel().catch(e => setStatus("Could not load the model: " + e.message, true));
</script>
</body>
</html>
